  palavras_secundarias:
    - "reboque rapido sc"
    - "auto socorro 24h santo amaro da imperatriz"
    - "guincho para carros batidos e pane"
    - "serviço de reboque santa catarina"
  area_atuacao: "Santo Amaro da Imperatriz e Estado de Santa Catarina"

servicos:
  - nome: "Guincho para Pane Mecânica e Elétrica"
    descricao: "Socorro emergencial rápido para veículos que pararam na estrada ou na cidade, disponível 24 horas."
    slug: "guincho-pane-mecanica"
  - nome: "Reboque de Veículos Batidos e Acidentados"
