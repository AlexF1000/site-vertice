  aesthetic: "Industrial, Robust, Masculine, High-Contrast, Dark Mode First"

role:
  persona: "Senior Frontend Engineer & UI/UX Designer"
  objective: "Build a high-converting, rugged, and professional one-page web interface for an emergency towing service using the exact color scheme, SEO targets, and business data below."

empresa:
  nome: "Reboque Rápido 24horas"
  segmento: "Serviço de Guincho e Auto Socorro 24 Horas"
  cidade: "Santo Amaro da Imperatriz"
  estado: "SC"
  pais: "BR"
  telefone: "5548999998888"
  whatsapp: "5548999998888"
  endereco: "Estrada Geral do Sítio de Dentro, S/N° - Santo Amaro da Imperatriz, CEP: 88141-174"
