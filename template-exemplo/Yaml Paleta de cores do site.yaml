# Antigravity IDE - Prompt Configuration & Design System
# Project: Towing & Roadside Assistance Website (Guincho Reboque - Força Bruta)
# Target: UI/UX & Frontend Development Rules

project:
  name: "Guincho Reboque - Força Bruta"
  type: "Landing Page / Service Website"
  industry: "Automotive / Emergency Towing Services"
  aesthetic: "Industrial, Robust, Masculine, High-Contrast, Dark Mode First"

role:
  persona: "Senior Frontend Engineer & UI/UX Designer"
  objective: "Build a high-converting, rugged, and professional web interface for an emergency towing service using the exact color scheme and branding guidelines below."

design_system:
  palette:
    primary:
      name: "Laranja Industrial (Industrial Amber)"
      hex: "#D97724"
      rgb: "rgb(217, 119, 36)"
      hsl: "hsl(27, 72%, 50%)"
      role: "Action, Urgency, Primary CTAs (Chamar Guincho, WhatsApp 24h), Key Highlights"
      contrast_text: "#FFFFFF"
      hover_state: "#B85F18"
      active_state: "#9E4F12"

    secondary:
      name: "Azul Petróleo Escuro (Deep Steel Blue)"
      hex: "#1A2B3C"
      rgb: "rgb(26, 43, 60)"
      hsl: "hsl(210, 40%, 17%)"
      role: "Structural elements, Headers, Footers, Navbars, Subtle borders, Badges"
      contrast_text: "#FFFFFF"

    background:
      main:
        name: "Cinza Chumbo Escuro (Dark Lead Charcoal)"
        hex: "#1E1F22"
        rgb: "rgb(30, 31, 34)"
        role: "Primary background (Dark Theme), Full-page body canvas"
      surface_card:
        name: "Cinza Aço Médio (Medium Steel Surface)"
        hex: "#2E3035"
        rgb: "rgb(46, 48, 53)"
        role: "Card components, Service boxes, Modal backdrops, Form inputs"
      surface_elevated:
        name: "Cinza Aço Claro (Elevated Gray)"
        hex: "#3A3D43"
        rgb: "rgb(58, 61, 67)"
        role: "Card hover states, Dropdown menus, Popovers"

    typography_colors:
      text_primary:
        name: "Branco Puro (Pure White)"
        hex: "#FFFFFF"
        role: "H1, H2, H3 titles, Button texts on dark/orange, High-priority text"
      text_secondary:
        name: "Prata Metálico Claro (Light Metallic Silver)"
        hex: "#B0B7BD"
        role: "Body paragraphs, Subtitles, Helper text, Inactive icons"
      text_muted:
        name: "Cinza Metálico Escuro (Muted Slate)"
        hex: "#747D88"
        role: "Placeholders, Timestamps, Disclaimers, Borders"

    status_and_accents:
      emergency_red: "#C0392B"
      success_green: "#27AE60"
      warning_amber: "#E67E22"
      metallic_border: "#40454E"

  typography:
    headings_font: "Impact, Montserrat, 'Teko', sans-serif"
    body_font: "'Inter', 'Roboto', sans-serif"
    weights:
      bold: 700
      extra_bold: 800
      black: 900

  ui_components:
    cta_button:
      background: "#D97724"
      color: "#FFFFFF"
      font_weight: 800
      text_transform: "uppercase"
      box_shadow: "0 4px 14px rgba(217, 119, 36, 0.4)"
      border_radius: "6px"
      hover:
        background: "#B85F18"
        transform: "translateY(-2px)"

    emergency_banner:
      background: "linear-gradient(90deg, #1A2B3C 0%, #D97724 100%)"
      color: "#FFFFFF"
      badge:
        background: "#D97724"
        text: "#FFFFFF"

    service_card:
      background: "#2E3035"
      border: "1px solid #40454E"
      hover_border: "1px solid #D97724"
      title_color: "#FFFFFF"
      description_color: "#B0B7BD"

code_integration:
  tailwind_config: |
    module.exports = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#D97724',
              'orange-hover': '#B85F18',
              petroleum: '#1A2B3C',
              charcoal: '#1E1F22',
              steel: '#2E3035',
              'steel-light': '#3A3D43',
              silver: '#B0B7BD',
              slate: '#747D88',
              border: '#40454E',
            }
          }
        }
      }
    }

  css_variables: |
    :root {
      --color-primary: #D97724;
      --color-primary-hover: #B85F18;
      --color-secondary: #1A2B3C;
      --color-bg-main: #1E1F22;
      --color-bg-card: #2E3035;
      --color-bg-card-hover: #3A3D43;
      --color-text-primary: #FFFFFF;
      --color-text-secondary: #B0B7BD;
      --color-border: #40454E;
    }

prompt_instructions:
  - "Always implement UI elements with dark theme as default."
  - "Reserve #D97724 (Industrial Orange) for primary conversion actions, emergency triggers, and active states."
  - "Use #1A2B3C (Steel Blue) for foundational navigation bars, hero backdrops, and footer panels."
  - "Ensure high contrast ratio (WCAG AA/AAA compliant) using #FFFFFF and #B0B7BD over dark backgrounds."
  - "Apply sharp/technical borders and subtle metallic shadows to convey durability, strength, and trust."