politica_privacidade:
  meta:
    titulo: "Política de Privacidade"
    empresa: "Vértice Social Mídia (Vertice SM)"
    dominio: "verticesocialmidia.com"
    dominio_alternativo: "verticesm.com"
    versao: "1.0"
    data_atualizacao: "2026-08-26"
    legislacao: "Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018)"

  secoes:
    - id: "introducao"
      titulo: "Visão Geral"
      conteudo: >
        Esta Política de Privacidade descreve como a Vértice Social Mídia coleta, utiliza,
        armazena e protege os dados pessoais dos usuários que acessam o site
        verticesocialmidia.com / verticesm.com, em estrita conformidade com a LGPD.

    - id: "informacoes_coletadas"
      titulo: "Informações Coletadas"
      itens:
        - categoria: "Dados fornecidos diretamente"
          descricao: "Nome, e-mail, telefone ou outras informações preenchidas voluntariamente em formulários de contato, orçamentos ou cadastros."
        - categoria: "Dados coletados automaticamente"
          descricao: "Endereço IP, tipo de navegador, páginas visitadas, tempo de permanência, localização geográfica aproximada e identificadores de cookies."

    - id: "finalidade_tratamento"
      titulo: "Finalidade do Tratamento dos Dados"
      finalidades:
        - "Responder a dúvidas, solicitações e fornecer atendimento ao cliente."
        - "Executar contratos ou prestar serviços solicitados pelo usuário."
        - "Analisar métricas de audiência para melhorar a experiência de navegação e desempenho do site."
        - "Enviar comunicações institucionais ou de marketing, mediante consentimento prévio."

    - id: "cookies"
      titulo: "Uso de Cookies e Tecnologias de Rastreamento"
      descricao: "Utilizamos cookies para garantir o funcionamento adequado da página, lembrar preferências e coletar dados analíticos."
      categorias:
        - tipo: "Cookies Necessários"
          finalidade: "Essenciais para a navegação básica e segurança da plataforma."
          obrigatorio: true
        - tipo: "Cookies Analíticos"
          finalidade: "Auxiliam na compreensão de como os visitantes interagem com o site (ex.: Google Analytics)."
          obrigatorio: false
        - tipo: "Cookies de Marketing"
          finalidade: "Utilizados para fornecer anúncios relevantes aos interesses do usuário."
          obrigatorio: false
      gestao_consentimento: "O usuário pode alterar ou revogar suas preferências a qualquer momento por meio do banner de consentimento ou nas configurações do navegador."

    - id: "compartilhamento_terceiros"
      titulo: "Compartilhamento de Dados com Terceiros"
      declaracao: "A Vértice Social Mídia não vende nem aluga dados pessoais."
      hipoteses:
        - "Provedores de hospedagem, infraestrutura e ferramentas analíticas."
        - "Cumprimento de obrigações legais, ordens judiciais ou solicitações de autoridades competentes."

    - id: "direitos_titular"
      titulo: "Direitos do Titular de Dados (Art. 18 LGPD)"
      direitos:
        - "Confirmar a existência de tratamento de dados."
        - "Acessar, corrigir ou atualizar dados incompletos, inexatos ou desatualizados."
        - "Solicitar anonimização, bloqueio ou eliminação de dados desnecessários ou excessivos."
        - "Revogar o consentimento a qualquer momento."

    - id: "seguranca"
      titulo: "Segurança da Informação"
      conteudo: >
        Adotamos medidas técnicas e organizacionais adequadas (como criptografia SSL/TLS
        e controle de acesso restrito) para proteger os dados pessoais contra acessos
        não autorizados, perdas ou alterações indevidas.

    - id: "contato_dpo"
      titulo: "Canal de Contato e Encarregado de Dados (DPO)"
      email: "contato@verticesocialmidia.com"
      email_secundario: "contato@verticesm.com"
      responsavel_dpo: "Encarregado de Proteção de Dados - Vértice Social Mídia"
      canal_atendimento: "https://verticesocialmidia.com/#contato"

cookie_consent_banner:
  id: "vertice-cookie-consent"
  trigger: "first_visit"
  position: "bottom-fixed"
  theme:
    bg_color: "#0f172a"
    text_color: "#f8fafc"
    accent_color: "#d4af37"
    border_radius: "12px"
    box_shadow: "0 10px 25px -5px rgba(0, 0, 0, 0.4)"

  content:
    title: "Sua privacidade é importante para nós"
    message: >
      Utilizamos cookies e tecnologias semelhantes para aprimorar sua experiência,
      analisar o tráfego e personalizar conteúdos e anúncios, em conformidade com a LGPD.
    privacy_policy_link:
      label: "Política de Privacidade (LGPD)"
      target_url: "/politica-de-privacidade/"
      open_in_new_tab: true

  actions:
    accept_all:
      label: "Aceitar Todos"
      action_type: "grant_all"
      style: "primary"
    reject_all:
      label: "Recusar Não Essenciais"
      action_type: "deny_optional"
      style: "outline"
    customize:
      label: "Personalizar"
      action_type: "open_modal"
      style: "ghost"

  categories:
    - id: "essential"
      name: "Cookies Estritamente Necessários"
      description: "Fundamentais para o funcionamento básico, navegação segura e integridade do site."
      required: true
      default_state: true
      editable: false

    - id: "analytics"
      name: "Cookies de Análise e Métricas"
      description: "Ajudam a entender o comportamento dos visitantes e medir a performance das páginas."
      required: false
      default_state: false
      editable: true

    - id: "marketing"
      name: "Cookies de Marketing e Remarketing"
      description: "Utilizados para rastrear conversões e exibir anúncios segmentados no Google e Meta."
      required: false
      default_state: false
      editable: true

  storage:
    key_name: "vertice_cookie_preferences"
    type: "localStorage"
    expiration_days: 180
